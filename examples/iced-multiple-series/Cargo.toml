[package]
name = "iced-multiple-series"
version = "0.1.0"
edition = "2024"

[dependencies]
csv = "1.4.0"
serde = { version = "1.0.228", features = ["derive"] }
iced = { version = "0.14.0", features = ["canvas"] }
vizkit = { path = "../..", features = ["time"] }
chrono = "0.4.44"

[build-dependencies]
reqwest = { version = "0.13.2", features = ["blocking"] }
